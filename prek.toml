# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

exclude = "[.](ipynb)$"

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v5.0.0"
hooks = [
  { id = "check-json" },
  { id = "check-toml" },
  {
    id = "check-yaml",
    args = ["--unsafe"]
  },
  { id = "check-xml" },
  { id = "check-case-conflict" },
  { id = "destroyed-symlinks" },
  {
    id = "detect-private-key",
    exclude = "^src/services/gcp-schema.ts$"
  },
  {
    id = "end-of-file-fixer",
    exclude = "^(src/api/|public/).*$"
  },
  {
    id = "trailing-whitespace",
    exclude = "^(src/api/|public/).*$"
  },
  { id = "check-added-large-files" }
]

[[repos]]
repo = "https://github.com/pre-commit/mirrors-prettier"  # zizmor: ignore[archived-uses]
rev = "v3.1.0"  # Use the specific version that matches your project's prettier version
hooks = [
  {
    id = "prettier",
    types_or = [
      "javascript",
      "jsx",
      "ts",
      "tsx",
      "json"
    ],
    exclude = "^(src/api/|public/).*$",
    additional_dependencies = ["prettier@3.6.2"]
  }
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.11.11"
hooks = [
  {
    id = "ruff",
    args = ["--fix"]
  },
  { id = "ruff-format" }
]

[[repos]]
repo = "https://github.com/hukkin/mdformat"
rev = "0.7.22"
hooks = [
  {
    id = "mdformat",
    additional_dependencies = [
      "mdformat-footnote",
      "mdformat-frontmatter",
      "mdformat-gfm",
      "mdformat-gfm-alerts",
      "mdformat-ruff",
      "mdformat-toc"
    ]
  }
]

[[repos]]
repo = "https://github.com/betterleaks/betterleaks"
rev = "v1.7.4"
hooks = [
  { id = "betterleaks" }
]
