name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          require-lockfile: true
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task lint

  prek:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@e06108dd0aef18192324c70427afc47652e63a82 # v7.5.0
      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0

  secret-scan:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dortort/betterleaks-action@cd0b905aa4befb8f42f8b1ab98150180c9e77515 # v0.1.0
        with:
          version: 'v1.7.4'
          scan-mode: 'auto'
          fail-on-leak: 'true'
          redact: 'true'
          verbose: 'true'

  docker-build:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - run: docker build -t evidential-fe -f Dockerfile.railway .
      - run: docker run -d --rm --name evidential-fe -p 3000:3000 evidential-fe
      - name: Smoke test
        run: |
          set -euo pipefail
          curl -fsS --retry 10 --retry-delay 1 --retry-all-errors http://localhost:3000/health | grep -F '"health":"ok"'
          curl -fsS http://localhost:3000/ > index.html
          asset=$(grep -oE '/_next/static/[^"]+\.(css|js)' index.html | head -1)
          test -n "${asset}"
          curl -fsS -o /dev/null "http://localhost:3000${asset}"
          curl -fsS -o /dev/null http://localhost:3000/evidential-logo.svg
      - if: failure()
        run: docker logs evidential-fe
