name: Secret Detection

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  betterleaks:
    name: Scan for secrets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dortort/betterleaks-action@v0.1.0
        with:
          scan-mode: 'auto'
          fail-on-leak: 'true'
          redact: 'true'
          verbose: 'true'
