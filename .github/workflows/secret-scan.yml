name: Secret Detection

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  betterleaks:
    name: Scan for secrets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Betterleaks
        run: go install github.com/betterleaks/betterleaks@v1.3.1

      - name: Run Betterleaks
        run: betterleaks git . -v --exit-code 1
