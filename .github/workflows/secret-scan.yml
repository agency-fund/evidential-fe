name: Secret Detection

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  betterleaks:
    name: Scan for secrets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Betterleaks
        run: |
          docker run --rm -v "$PWD":/repo ghcr.io/betterleaks/betterleaks:latest git /repo -v --exit-code 1
