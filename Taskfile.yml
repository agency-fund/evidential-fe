version: '3'
output: prefixed
env:
  NEXT_TELEMETRY_DISABLED: '1'

  # Sentry doesn't work with Turbopack but we don't care because we don't use Sentry in local development and Turbopack
  # is only being used in local dev. This silences some warnings.
  SENTRY_SUPPRESS_TURBOPACK_WARNING: '1'

  # The base URL of the xngin API server. Code will append the paths to the API endpoints (e.g. v1/m/apikeys, filters).
  NEXT_PUBLIC_XNGIN_API_BASE_URL: http://localhost:8000
  # The base URL of the xngin OIDC API. The identity provider itself is configured on the backend (XNGIN_OIDC_*).
  NEXT_PUBLIC_XNGIN_OIDC_BASE_URL: http://localhost:8000/v1/a/oidc
tasks:
  check-prek:
    desc: "Fail if the prek git hook is not installed in this repo."
    status:
      - grep -q "File generated by prek" "$(git rev-parse --git-path hooks/pre-commit)"
    cmd: |
      echo "⚠️ prek hooks are not installed in this repo. To fix, run: prek install -f" >&2
      exit 1
  nodedeps:
    deps:
      - task: check-prek
        silent: true
    cmd: |
      if ! command -v pnpm >/dev/null 2>&1; then
        echo "Error: pnpm is not installed or not in PATH. Install it from https://pnpm.io/installation." >&2
        exit 1
      fi
      pnpm install --frozen-lockfile
  start:
    desc: 'Starts the development server'
    interactive: true
    dotenv:
      - .env
    deps:
      - task: nodedeps
        silent: true
    cmd: pnpm run dev
  start-airplane:
    desc: "Like start, but runs the frontend in airplane mode. The UI will identify you as testing@example.com automatically."
    env:
      NEXT_PUBLIC_AIRPLANE_MODE: "true"
    interactive: true
    cmd: task start
  genapiclient:
    desc: 'Updates the generated API client from the apiserver running at http://localhost:8000'
    cmd: |
      curl --no-progress-meter --retry 10 --retry-connrefused --max-time 3 \
        -o /tmp/apispec.json http://localhost:8000/openapi.json
      jq . /tmp/apispec.json > openapi.json
      pnpm exec orval --config orval.config.ts
      if [ $? -eq 0 ]; then
        task lint
      fi
  lint-next: pnpm run lint
  lint-tsc: pnpm exec tsc --noemit
  lint:
    deps:
      - lint-tsc
      - lint-next
    desc: 'Runs the NextJS-managed linter'
  build:
    desc: 'Production build of the NextJS application'
    cmd: pnpm run build
  analyze:
    desc: 'Production build with bundle-analyzer reports written to .next/analyze/{client,nodejs,edge}.html'
    env:
      ANALYZE: 'true'
    cmd: pnpm run build
  railway-build:
    desc: 'Builds the Docker image used by the Railway deployment.'
    cmd: docker build -t evidential-fe -f Dockerfile.railway .
  railway-run:
    desc: 'Runs the Docker image in a similar way to how Railway runs it.'
    interactive: true
    cmd: docker run --rm -it -p 3000:3000 evidential-fe
