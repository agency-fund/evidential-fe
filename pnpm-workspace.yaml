strictPeerDependencies: true
saveExact: true
# min age is in minutes for pnpm; 5d=7200
minimumReleaseAge: 7200
# Admitted before aging out of minimumReleaseAge; pruned automatically once they are older than the minimum.
minimumReleaseAgeExclude:
- '@types/node@26.4.1'
- '@next/bundle-analyzer@16.4.3'
- '@next/env@16.4.3'
- '@next/eslint-plugin-next@16.4.3'
- '@next/swc-darwin-arm64@16.4.3'
- '@next/swc-darwin-x64@16.4.3'
- '@next/swc-linux-arm64-gnu@16.4.3'
- '@next/swc-linux-arm64-musl@16.4.3'
- '@next/swc-linux-x64-gnu@16.4.3'
- '@next/swc-linux-x64-musl@16.4.3'
- '@next/swc-win32-arm64-msvc@16.4.3'
- '@next/swc-win32-x64-msvc@16.4.3'
- eslint-config-next@16.4.3
- next@16.4.3
minimumReleaseAgeExcludePrune: true
publicHoistPattern:
- "*import-in-the-middle*"
- "*require-in-the-middle*"

allowBuilds:
  '@biomejs/biome': true
  '@sentry/cli': true
  esbuild: true
  sharp: true

updateNotifier: false

overrides:
  # Orval pins a vulnerable js-yaml; remove after its dependency is patched.
  'js-yaml@>=4 <4.3.1': 4.3.1
  # Orval's Spectral toolchain resolves vulnerable lodash versions.
  'lodash@<=4.17.23': 4.18.1
